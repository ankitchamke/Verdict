<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="100%" height="100%">
  <defs>
    <!-- Brand Lime Green Gradient -->
    <linearGradient id="limeDot" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#D4FC34" />
      <stop offset="100%" stop-color="#B1E600" />
    </linearGradient>
  </defs>

  <!-- Clean dark charcoal canvas for high visibility in browser tabs -->
  <rect width="32" height="32" rx="7" fill="#161B26" />

  <!-- Stylized lowercase 'v' matching the brand typeface -->
  <text x="6" y="23" 
        font-family="Inter, system-ui, -apple-system, sans-serif" 
        font-size="20" 
        font-weight="800" 
        fill="#FFFFFF">v</text>

  <!-- The signature brand dot accent -->
  <circle cx="22" cy="21" r="2.5" fill="url(#limeDot)" />
</svg>
