kind = "web"
previewPath = "/"
title = "Verdict"
description = "A premium landing page for Verdict, an AI idea validator that helps founders pressure-test ideas before spending months building them."
version = "1.0.0"
id = "artifacts/verdict"
router = "path"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 20591

[services.development]
run = "pnpm --filter @workspace/verdict run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/verdict", "run", "build" ]
serve = "static"
publicDir = "artifacts/verdict/dist/public"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "20591"
BASE_PATH = "/"
